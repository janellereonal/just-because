services:
  app:
    image: ${APP_IMAGE:-ghcr.io/janellereonal/just-because:latest}
    build:
      context: ../..
      dockerfile: deployment/app/Dockerfile
      args:
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_REGION: ${VITE_POSTHOG_REGION:-us}
        VITE_MEDIA_STORAGE_PROVIDER: ${VITE_MEDIA_STORAGE_PROVIDER:-r2}
        VITE_R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-r2}
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["public"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  migrate:
    image: ${APP_IMAGE:-ghcr.io/janellereonal/just-because:latest}
    pull_policy: ${APP_PULL_POLICY:-missing}
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_UNPOOLED:-${DATABASE_URL:-}}
    entrypoint: ["node"]
    command: ["scripts/migrate.ts"]
    profiles: ["maintenance"]

volumes:
  caddy_data:
  caddy_config:
