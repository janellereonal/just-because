<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}#v{width:640px;height:360px;overflow:hidden}</style></head>
<body><div id="v"></div>
<script>
const W = 640, H = 360;
let s = 9; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647); const seed = (n) => { s = n; };
// Damped spring from 0 to 1 starting at t0.
const spring = (t, t0, k = 9, z = 0.45) => { const x = t - t0; if (x <= 0) return 0; return 1 - Math.exp(-z * k * x) * Math.cos(k * Math.sqrt(1 - z * z) * x); };
const ease = (t, a, b) => { const x = Math.min(1, Math.max(0, (t - a) / (b - a))); return x * x * (3 - 2 * x); };
const clip = (v) => Math.max(0, Math.min(1, v));
const DEFS = `<filter id="b8"><feGaussianBlur stdDeviation="8"/></filter><filter id="b20"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
const DOG = (x, y, sc, legs) => `<g transform="translate(${x} ${y}) scale(${sc})">
  <ellipse cx="60" cy="114" rx="34" ry="5" fill="#000" opacity=".18"/>
  <ellipse cx="60" cy="95" rx="26" ry="19" fill="#E2B07A"/>
  <ellipse cx="${49 + legs * 6}" cy="110" rx="8.5" ry="5.5" fill="#FFF3E2"/><ellipse cx="${71 - legs * 6}" cy="110" rx="8.5" ry="5.5" fill="#FFF3E2"/>
  <path d="M26 52c0-22 15-34 34-34s34 12 34 34c0 20-15 32-34 32S26 72 26 52z" fill="#E2B07A"/>
  <path d="M30 30c-10 2-17 14-16 30 1 10 7 16 13 13 6-3 7-14 8-24 1-9-1-17-5-19z" fill="#8A5634" transform="rotate(${-legs * 14} 30 30)"/>
  <path d="M90 30c10 2 17 14 16 30-1 10-7 16-13 13-6-3-7-14-8-24-1-9 1-17 5-19z" fill="#8A5634" transform="rotate(${legs * 14} 90 30)"/>
  <path d="M30 70q30 10 60 0l-2 8q-28 8-56 0z" fill="#C0582F"/>
  <ellipse cx="60" cy="67" rx="16" ry="11.5" fill="#FFF3E2"/>
  <path d="M54 61c0-3 3-4 6-4s6 1 6 4-3 5-6 5-6-2-6-5z" fill="#2B2522"/>
  <path d="M42 50q5-5 10 0M68 50q5-5 10 0" stroke="#2B2522" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M54 71q6 10 12 0z" fill="#E8576E" stroke="#2B2522" stroke-width="2"/>
</g>`;

const SCENES = {
  /* Ana's office: balloons rise, confetti falls, the words spring in. */
  ana(t) {
    seed(4);
    const conf = Array.from({ length: 70 }, () => ({ x: rnd() * W, d: rnd() * 2, sp: 60 + rnd() * 80, c: ["#FF7EB6", "#FFD166", "#6C8EF2", "#7ED7C1", "#fff"][Math.floor(rnd() * 5)], r: rnd() * 360 }));
    const balloons = Array.from({ length: 7 }, (_, i) => ({ x: 40 + i * 92 + rnd() * 20, d: rnd() * 0.8, c: ["#FF7EB6", "#FFD166", "#6C8EF2", "#7ED7C1", "#F2652E", "#B48AF2", "#FF9EB5"][i] }));
    const pop = spring(t, 0.6), pop2 = spring(t, 1.3), pop3 = spring(t, 2.0);
    return `<rect width="${W}" height="${H}" fill="#2B2F7A"/>
    <radialGradient id="ag" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#5B63D6"/><stop offset="1" stop-color="#1D1F55"/></radialGradient><rect width="${W}" height="${H}" fill="url(#ag)"/>
    ${balloons.map((b) => { const y = H + 80 - (t - b.d) * 90 + Math.sin(t * 2 + b.x) * 4; const x = b.x + Math.sin(t * 1.4 + b.x) * 8; return `<g transform="translate(${x} ${y})"><path d="M0 34q6 20-4 50" stroke="#fff" stroke-opacity=".6" fill="none"/><ellipse rx="26" ry="32" fill="${b.c}"/><ellipse cx="-9" cy="-12" rx="6" ry="10" fill="#fff" opacity=".35"/><path d="M-4 32h8l-4 6z" fill="${b.c}"/></g>`; }).join("")}
    ${conf.map((c) => { const y = -20 + (t - c.d) * c.sp; if (y < -20) return ""; return `<rect x="${c.x + Math.sin(t * 3 + c.x) * 14}" y="${y % (H + 40)}" width="8" height="14" rx="2" fill="${c.c}" transform="rotate(${c.r + t * 200} ${c.x} ${y % (H + 40)})"/>`; }).join("")}
    <g transform="translate(${W / 2} 150) scale(${0.6 + 0.4 * pop})" opacity="${clip(pop * 2)}">
      <text text-anchor="middle" font-family="Caprasimo" font-size="64" fill="#FFD166" stroke="#1D1F55" stroke-width="10" paint-order="stroke">Happy 30th,</text>
    </g>
    <g transform="translate(${W / 2} 230) scale(${0.5 + 0.5 * pop2}) rotate(${(1 - pop2) * -10})" opacity="${clip(pop2 * 2)}">
      <text text-anchor="middle" font-family="Caprasimo" font-size="96" fill="#FF7EB6" stroke="#1D1F55" stroke-width="12" paint-order="stroke">Ana</text>
    </g>
    <text x="${W / 2}" y="${300 + (1 - pop3) * 20}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="18" letter-spacing="3" fill="#fff" opacity="${clip(pop3)}">FROM EVERYONE AT THE OFFICE</text>`;
  },
  /* Sam: a little plane flies the route home to Lisbon, stamps land. */
  sam(t) {
    seed(7);
    const p = ease(t, 0.3, 3.6);
    const path = (u) => [60 + u * 520, 260 - Math.sin(u * Math.PI) * 170];
    const [px, py] = path(p); const [qx, qy] = path(Math.min(1, p + 0.01));
    const ang = (Math.atan2(qy - py, qx - px) * 180) / Math.PI;
    const dots = Array.from({ length: 40 }, (_, i) => i / 40).filter((u) => u < p).map((u) => { const [x, y] = path(u); return `<circle cx="${x}" cy="${y}" r="2.5" fill="#F2652E"/>`; }).join("");
    const stamp = (u, x, y, label, rot, c) => { const k = spring(t, u, 14, 0.5); if (t < u) return ""; return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${1.8 - 0.8 * k})" opacity="${clip(k * 1.5) * 0.85}"><circle r="40" fill="none" stroke="${c}" stroke-width="4"/><circle r="32" fill="none" stroke="${c}" stroke-width="1.5"/><text text-anchor="middle" y="6" font-family="Space Mono" font-weight="700" font-size="15" fill="${c}">${label}</text></g>`; };
    return `<rect width="${W}" height="${H}" fill="#F6F0E4"/>
    ${Array.from({ length: 30 }, () => `<path d="M${rnd() * W} ${rnd() * H}h40" stroke="#22303F" stroke-opacity=".05" stroke-width="2"/>`).join("")}
    <path d="M30 300q120-60 220-20t180-40 200 30" fill="#8EC0E8" opacity=".25"/>
    ${dots}
    <circle cx="60" cy="260" r="8" fill="#22303F"/><text x="60" y="292" text-anchor="middle" font-family="Space Mono" font-size="14" fill="#22303F">HOME</text>
    <circle cx="580" cy="260" r="8" fill="#F2652E"/><text x="580" y="292" text-anchor="middle" font-family="Space Mono" font-size="14" fill="#22303F">LISBON</text>
    <g transform="translate(${px} ${py}) rotate(${ang})"><path d="M18 0L-14-12-8 0-14 12z" fill="#22303F"/><path d="M2-2l-6-16h-6l4 16zM2 2l-6 16h-6l4-16z" fill="#22303F"/></g>
    ${stamp(1.2, 150, 90, "JORDAN", -12, "#F2652E")}${stamp(1.8, 300, 70, "MIA", 8, "#2F6FA8")}${stamp(2.4, 470, 95, "RAVI", -6, "#22303F")}${stamp(3.0, 590, 150, "HANA", 10, "#F2652E")}
    <text x="${W / 2}" y="${H - 22}" text-anchor="middle" font-family="Fraunces" font-style="italic" font-size="28" fill="#22303F" opacity="${ease(t, 3.4, 4.0)}">Go get them, Sam. Love, the team</text>`;
  },
  /* Milo's zoomies. */
  milo(t) {
    seed(3);
    const run = (t * 0.9) % 2;
    const x = run < 1 ? -140 + run * 920 : 780 - (run - 1) * 920;
    const dir = run < 1 ? 1 : -1;
    const hop = Math.abs(Math.sin(t * 12)) * 18;
    const legs = Math.sin(t * 24);
    return `<linearGradient id="mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE3F5"/><stop offset="1" stop-color="#F6F0D8"/></linearGradient>
    <rect width="${W}" height="${H}" fill="url(#mk)"/>
    <circle cx="540" cy="70" r="34" fill="#FFF4C9"/>
    <ellipse cx="140" cy="200" rx="110" ry="80" fill="#9ACB86"/><rect x="132" y="230" width="16" height="70" fill="#7A5644"/>
    <ellipse cx="520" cy="210" rx="130" ry="90" fill="#8CC17E"/><rect x="510" y="250" width="18" height="60" fill="#7A5644"/>
    <path d="M0 280q320-30 640 0V360H0z" fill="#93C673"/>
    ${Array.from({ length: 50 }, () => { const gx = rnd() * W, gy = 285 + rnd() * 70; return `<path d="M${gx} ${gy}l2-8 2 8" stroke="#78AE5B" stroke-width="2" fill="none"/>`; }).join("")}
    ${[0.1, 0.2, 0.3].map((k) => `<circle cx="${x - dir * (40 + k * 160)}" cy="${318 + Math.sin(t * 9 + k * 9) * 3}" r="${10 - k * 20}" fill="#fff" opacity="${0.5 - k}"/>`).join("")}
    <g transform="translate(${x} ${200 - hop}) scale(${dir} 1)">${DOG(-60, 0, 1.0, legs)}</g>
    <text x="24" y="44" font-family="Cabinet Grotesk, DM Sans" font-weight="800" font-size="28" fill="#3A2A22">ZOOMIES</text>
    <text x="24" y="70" font-family="Sentient, Fraunces" font-size="18" fill="#3A2A22" opacity=".75">6pm, every single day</text>`;
  },
  /* Nora & James: two glasses clink, sparkles. */
  wedding(t) {
    seed(5);
    const k = spring(t, 0.5, 7, 0.35);
    const sep = 120 * (1 - k);
    const sparkle = clip((t - 1.0) * 2) * clip(1 - (t - 2.4));
    const glass = (cx, rot) => `<g transform="translate(${cx} 180) rotate(${rot})"><path d="M-30-90h60l-8 90q-22 18-44 0z" fill="#F4E3B5" opacity=".85"/><path d="M-30-90h60l-8 90q-22 18-44 0z" fill="none" stroke="#fff" stroke-width="3"/><path d="M-22-60h44l-6 56q-16 12-32 0z" fill="#E5C26B" opacity=".8"/>${Array.from({ length: 6 }, (_, i) => `<circle cx="${-12 + (i * 9) % 24}" cy="${-20 - ((t * 60 + i * 23) % 50)}" r="2.5" fill="#fff" opacity=".8"/>`).join("")}<rect x="-3" y="10" width="6" height="70" fill="#fff" opacity=".85"/><ellipse cx="0" cy="82" rx="26" ry="6" fill="#fff" opacity=".85"/></g>`;
    return `<radialGradient id="wg" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#FBF3E6"/><stop offset="1" stop-color="#C9A69A"/></radialGradient><rect width="${W}" height="${H}" fill="url(#wg)"/>
    ${Array.from({ length: 18 }, () => `<circle cx="${rnd() * W}" cy="${rnd() * H}" r="${8 + rnd() * 24}" fill="#fff" opacity="${0.2 + rnd() * 0.3}" filter="url(#b8)"/>`).join("")}
    ${glass(W / 2 - 34 - sep, 12 - 8 * k)}${glass(W / 2 + 34 + sep, -12 + 8 * k)}
    <g opacity="${sparkle}" transform="translate(${W / 2} 92)">${Array.from({ length: 10 }, (_, i) => { const a = (i / 10) * Math.PI * 2, r = 30 + (t - 1) * 60; return `<path d="M${Math.cos(a) * r} ${Math.sin(a) * r}l3-9 3 9 9 3-9 3-3 9-3-9-9-3z" fill="#E5C26B"/>`; }).join("")}</g>
    <text x="${W / 2}" y="320" text-anchor="middle" font-family="Cormorant Garamond" font-style="italic" font-weight="600" font-size="40" fill="#3A3A33" opacity="${ease(t, 1.6, 2.4)}">To Nora &amp; James</text>`;
  },
  /* Anyone: three polaroids drop onto a table, hearts drift up, a line of thanks. */
  generic(t) {
    seed(11);
    const hearts = Array.from({ length: 16 }, () => ({ x: rnd() * W, d: rnd() * 3, sp: 40 + rnd() * 40, s: 0.6 + rnd() * 0.8, c: ["#E8577E", "#F2A2B6", "#E5C26B"][Math.floor(rnd() * 3)] }));
    const pol = (u, x, y, rot, sky, ground) => { const k = spring(t, u, 10, 0.42); if (t < u) return ""; return `<g transform="translate(${x} ${y - (1 - k) * 220}) rotate(${rot * k})"><rect x="-62" y="-70" width="124" height="148" rx="3" fill="#fff"/><rect x="-62" y="-70" width="124" height="148" rx="3" fill="none" stroke="#000" stroke-opacity=".06"/><rect x="-52" y="-60" width="104" height="104" fill="${sky}"/><path d="M-52 20q30-26 52-8t52-6v38h-104z" fill="${ground}"/><circle cx="26" cy="-34" r="11" fill="#FFF4C9"/></g>`; };
    return `<linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBEFE6"/><stop offset="1" stop-color="#F2D9CB"/></linearGradient><rect width="${W}" height="${H}" fill="url(#gg)"/>
    ${hearts.map((h) => { const y = H + 30 - (t - h.d) * h.sp; if (y > H + 30) return ""; return `<path transform="translate(${h.x + Math.sin(t * 2 + h.x) * 10} ${y}) scale(${h.s})" d="M0 6C-10-4-14-12-8-16S2-14 0-10C-2-14 2-20 8-16S10-4 0 6z" fill="${h.c}" opacity=".7"/>`; }).join("")}
    ${pol(0.3, 200, 150, -9, "#BFD7EC", "#9ACB86")}${pol(0.8, 440, 150, 8, "#F6C9A8", "#E8A27A")}${pol(1.3, 320, 140, -2, "#D9CFF2", "#B48AF2")}
    <text x="${W / 2}" y="${318 + (1 - ease(t, 2.0, 2.7)) * 14}" text-anchor="middle" font-family="Fraunces" font-style="italic" font-size="32" fill="#3A2A22" opacity="${ease(t, 2.0, 2.7)}">From all of us, with love</text>`;
  },
};
window.render = (name, t) => { document.getElementById("v").innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><defs>${DEFS}</defs>${SCENES[name](t)}</svg>`; };
</script></body></html>
