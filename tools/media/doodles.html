<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;display:flex;flex-wrap:wrap;gap:10px;background:#333}.scene{width:600px;height:600px}</style></head><body><script>
let s=5; const rnd=()=>((s=(s*16807)%2147483647)/2147483647); const seed=n=>{s=n};
const j=(a)=>(rnd()-.5)*a;
// A wobbly hand-drawn polyline through points.
function line(pts,c='#2B2522',w=7,close=false){ const p=pts.map(([x,y])=>[x+j(3),y+j(3)]); if(close)p.push([p[0][0]+j(4),p[0][1]+j(4)]); let d=`M${p[0][0]} ${p[0][1]}`; for(let i=1;i<p.length;i++){const [x0,y0]=p[i-1],[x1,y1]=p[i]; d+=` Q${(x0+x1)/2+j(5)} ${(y0+y1)/2+j(5)} ${x1} ${y1}`;} return `<path d="${d}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`; }
function circle(cx,cy,r,c,w,ry=r,start=0,end=Math.PI*2.08){ const n=26,pts=[]; for(let i=0;i<=n;i++){const a=start+(end-start)*i/n; pts.push([cx+Math.cos(a)*r*(1+j(.06)),cy+Math.sin(a)*ry*(1+j(.06))]);} return line(pts,c,w); }
function heart(x,y,sz,c,w=6){ const pts=[]; for(let i=0;i<=30;i++){const t=i/30*Math.PI*2; pts.push([x+sz*16*Math.pow(Math.sin(t),3)*1.1, y-sz*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*1.1]);} return line(pts,c,w); }
function fillBlob(x,y,r,c){ return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity=".85"/>`;}
function scene(id,body){ const d=document.createElement('div'); d.className='scene'; d.id=id; d.innerHTML=`<svg viewBox="0 0 600 600" width="600" height="600"><rect width="600" height="600" fill="#FFFEFA"/>${body}</svg>`; document.body.appendChild(d); }
const INK='#2B2522';
seed(1); scene('doodle-ana', `
  ${circle(300,290,150,'#F2B9A0',0)}
  <ellipse cx="300" cy="300" rx="130" ry="150" fill="#FBD9C4" opacity=".7"/>
  ${circle(300,300,130,INK,7,150)}
  ${Array.from({length:14},(_,i)=>circle(180+i*18+j(6),170+Math.abs(i-6.5)*8+j(8),26,'#5B3A2A',7)).join('')}
  ${circle(250,290,12,INK,7)}${circle(350,290,12,INK,7)}
  ${fillBlob(250,292,7,INK)}${fillBlob(350,292,7,INK)}
  ${line([[240,370],[270,395],[300,402],[330,395],[360,370]],'#E8577E',8)}
  ${circle(215,345,18,'#F27A93',6)}${circle(385,345,18,'#F27A93',6)}
  ${line([[250,120],[300,40],[350,120]],'#6C8EF2',8)}${line([[250,120],[350,120]],'#6C8EF2',8)}${circle(300,36,12,'#FFD166',8)}
  ${heart(500,110,2.2,'#E8577E',6)}${heart(90,470,1.6,'#E8577E',6)}
`);
seed(2); scene('doodle-cake', `
  ${line([[150,330],[450,330],[450,500],[150,500]],INK,7,true)}
  <rect x="155" y="335" width="290" height="160" fill="#F7B6C4" opacity=".55"/>
  ${line([[150,380],[190,400],[230,378],[270,402],[310,380],[350,402],[390,380],[450,398]],'#E8577E',7)}
  ${line([[200,230],[400,230],[400,330],[200,330]],INK,7,true)}
  <rect x="205" y="235" width="190" height="90" fill="#FFF0B8" opacity=".7"/>
  ${[240,300,360].map((x,i)=>line([[x,230],[x,160]],['#6C8EF2','#7ED7C1','#E8577E'][i],12)+line([[x,145],[x-10,128],[x,108],[x+10,128],[x,145]],'#F2A93B',6)).join('')}
  ${line([[110,500],[490,500]],INK,8)}
  ${[...Array(10)].map(()=>line([[180+rnd()*240,420+rnd()*60],[190+rnd()*240,425+rnd()*60]],['#6C8EF2','#FFD166','#7ED7C1'][Math.floor(rnd()*3)],6)).join('')}
  ${line([[60,120],[80,80],[100,120]],'#FFD166',6)}${line([[520,180],[540,140],[560,180]],'#6C8EF2',6)}
`);
seed(3); scene('doodle-plane', `
  ${line([[60,470],[120,430],[190,445],[250,400],[310,410],[360,360]],'#F2652E',6)}
  <g opacity=".9">${[...Array(7)].map((_,i)=>circle(70+i*48,470-i*16,3,'#F2652E',5)).join('')}</g>
  ${line([[360,330],[520,250],[545,265],[430,370]],INK,8,true)}
  <path d="M362 332L520 252L543 266L430 368Z" fill="#8EC0E8" opacity=".6"/>
  ${line([[430,300],[400,220],[380,230],[400,320]],INK,7)}
  ${line([[440,350],[470,420],[490,410],[460,340]],INK,7)}
  ${circle(150,150,46,'#FFD166',8)}
  ${line([[80,260],[120,240],[160,250],[200,240]],'#8EC0E8',7)}${line([[420,130],[460,115],[500,125]],'#8EC0E8',7)}
  ${heart(250,180,2,'#E8577E',6)}
`);
seed(4); scene('doodle-milo', `
  <ellipse cx="300" cy="320" rx="150" ry="140" fill="#F3D3A8" opacity=".7"/>
  ${circle(300,320,150,INK,7,140)}
  ${line([[160,250],[110,300],[100,400],[140,430],[175,360]],'#8A5634',9)}
  ${line([[440,250],[490,300],[500,400],[460,430],[425,360]],'#8A5634',9)}
  ${circle(250,300,10,INK,9)}${circle(350,300,10,INK,9)}
  ${circle(300,370,22,INK,8,16)}<ellipse cx="300" cy="368" rx="20" ry="14" fill="${INK}"/>
  ${line([[270,410],[300,430],[330,410]],INK,7)}
  ${line([[300,430],[300,480],[318,500],[332,470],[330,430]],'#E8577E',7)}
  ${line([[190,470],[410,470]],'#C0582F',10)}${circle(300,488,12,'#E5C26B',7)}
  ${heart(500,140,2.2,'#E8577E',6)}${heart(100,130,1.6,'#E8577E',6)}
`);
seed(5); scene('doodle-wedding', `
  ${circle(300,330,190,'#8FA982',8,190,Math.PI,Math.PI*2)}
  ${[...Array(9)].map((_,i)=>{const a=Math.PI+i*Math.PI/8; return circle(300+Math.cos(a)*190,330+Math.sin(a)*190,16,['#E8A3A8','#F2C6C2','#fff'][i%3],6)}).join('')}
  ${circle(240,270,30,INK,7)}${line([[240,300],[240,420]],INK,7)}${line([[240,420],[190,520],[290,520],[240,420]],INK,7,true)}<path d="M240 420L190 520L290 520Z" fill="#fff"/>
  ${line([[240,330],[300,350],[360,330]],INK,7)}
  ${circle(360,265,30,INK,7)}${line([[360,295],[360,420]],INK,7)}${line([[360,420],[335,520]],INK,7)}${line([[360,420],[385,520]],INK,7)}
  ${line([[345,305],[360,320],[375,305]],INK,6)}
  ${heart(300,200,2.4,'#E8577E',7)}
  ${line([[60,560],[540,560]],'#8FA982',6)}
`);
seed(6); scene('doodle-toast', `
  ${[[-1,'#F4E3B5'],[1,'#F4E3B5']].map(([sd,c])=>{const x=300+sd*70; return `<g transform="rotate(${sd*14} ${x} 420)">`+`<path d="M${x-45} 200L${x+45} 200L${x+30} 330Q${x} 350 ${x-30} 330Z" fill="${c}" opacity=".8"/>`+line([[x-45,200],[x+45,200],[x+30,330],[x,350],[x-30,330],[x-45,200]],INK,7)+line([[x,350],[x,450]],INK,7)+line([[x-40,455],[x+40,455]],INK,7)+[...Array(4)].map(()=>circle(x-20+rnd()*40,240+rnd()*70,5,'#fff',4)).join('')+`</g>`}).join('')}
  ${[...Array(8)].map((_,i)=>{const a=-Math.PI/2+(i-3.5)*0.32; return line([[300+Math.cos(a)*90,170+Math.sin(a)*90],[300+Math.cos(a)*140,170+Math.sin(a)*140]],'#E5C26B',7)}).join('')}
  ${heart(120,520,1.6,'#E8577E',6)}${heart(480,520,1.6,'#E8577E',6)}
`);
</script></body></html>
