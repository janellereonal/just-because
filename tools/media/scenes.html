<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; background: #222; display: flex; flex-wrap: wrap; gap: 10px; font-family: "Fraunces", serif; }
  .scene { width: 800px; height: 800px; position: relative; overflow: hidden; }
  .scene svg { display: block; width: 800px; height: 800px; }
</style>
</head>
<body>
<script>
// Seeded random so every render is the same.
let s = 7;
const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
const seed = (n) => { s = n; };
const NS = "http://www.w3.org/2000/svg";
const DEFS = `
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="over"/>
  </filter>
  <filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="b10"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="b24"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="b50"><feGaussianBlur stdDeviation="50"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="vig" cx="50%" cy="48%" r="72%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></radialGradient>
`;
function scene(id, body, w = 800, h = 800) {
  const div = document.createElement("div");
  div.className = "scene"; div.id = id; div.style.width = w + "px"; div.style.height = h + "px";
  div.innerHTML = `<svg xmlns="${NS}" viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px"><defs>${DEFS}</defs>${body}
    <rect width="${w}" height="${h}" fill="url(#vig)"/>
    <rect width="${w}" height="${h}" fill="#fff" filter="url(#grain)" opacity=".28" style="mix-blend-mode:soft-light"/></svg>`;
  document.body.appendChild(div);
}
const bokeh = (n, colors, ymax = 500, rmin = 10, rmax = 50, op = 0.35) =>
  Array.from({ length: n }, () => `<circle cx="${rnd() * 800}" cy="${rnd() * ymax}" r="${rmin + rnd() * (rmax - rmin)}" fill="${colors[Math.floor(rnd() * colors.length)]}" opacity="${op * (0.4 + rnd() * 0.6)}" filter="url(#b10)"/>`).join("");

/* The golden dog, front view, from the cast (120x120 box). */
const DOG = (x, y, sc, mood = "awake") => `<g transform="translate(${x} ${y}) scale(${sc})">
  <ellipse cx="60" cy="114" rx="34" ry="5" fill="#000" opacity=".18"/>
  <path d="M80 98c10-2 18-10 20-22 1-5 6-4 6 1-1 15-11 26-24 27z" fill="#E2B07A"/>
  <ellipse cx="60" cy="95" rx="26" ry="19" fill="#E2B07A"/>
  <path d="M46 84c4 10 24 10 28 0 2 8-2 20-14 21-12-1-16-13-14-21z" fill="#FFF3E2"/>
  <ellipse cx="49" cy="110" rx="8.5" ry="5.5" fill="#FFF3E2"/><ellipse cx="71" cy="110" rx="8.5" ry="5.5" fill="#FFF3E2"/>
  <path d="M26 52c0-22 15-34 34-34s34 12 34 34c0 20-15 32-34 32S26 72 26 52z" fill="#E2B07A"/>
  <ellipse cx="74" cy="48" rx="11" ry="10" fill="#C08A55" opacity=".55"/>
  <path d="M30 30c-10 2-17 14-16 30 1 10 7 16 13 13 6-3 7-14 8-24 1-9-1-17-5-19z" fill="#8A5634"/>
  <path d="M90 30c10 2 17 14 16 30-1 10-7 16-13 13-6-3-7-14-8-24-1-9 1-17 5-19z" fill="#8A5634"/>
  <path d="M30 70q30 10 60 0l-2 8q-28 8-56 0z" fill="#C0582F"/>
  <circle cx="60" cy="80" r="3.4" fill="#E5C26B"/>
  <ellipse cx="60" cy="67" rx="16" ry="11.5" fill="#FFF3E2"/>
  <path d="M54 61c0-3 3-4 6-4s6 1 6 4-3 5-6 5-6-2-6-5z" fill="#2B2522"/>
  ${mood === "sleep"
    ? `<path d="M42 50q5 4 10 0M68 50q5 4 10 0" stroke="#2B2522" stroke-width="2.6" fill="none" stroke-linecap="round"/>`
    : `<ellipse cx="47" cy="50" rx="4.8" ry="5.4" fill="#2B2522"/><ellipse cx="73" cy="50" rx="4.8" ry="5.4" fill="#2B2522"/><circle cx="48.6" cy="48" r="1.6" fill="#fff"/><circle cx="74.6" cy="48" r="1.6" fill="#fff"/>`}
  <path d="M55 71q5 ${mood === "happy" ? 8 : 4} 10 0" stroke="#2B2522" stroke-width="2.2" fill="${mood === "happy" ? "#E8576E" : "none"}" stroke-linecap="round"/>
  <ellipse cx="38" cy="64" rx="6" ry="4" fill="#F27A93" opacity=".35"/><ellipse cx="82" cy="64" rx="6" ry="4" fill="#F27A93" opacity=".35"/>
</g>`;

/* 1. Cake, Ana's 30th */

  <rect width="800" height="800" fill="url(#ck1)"/>
  ${bokeh(26, ["#FFE3A3", "#FF9EB5", "#FFD27F", "#fff"], 520, 12, 46, 0.5)}
  <rect y="560" width="800" height="240" fill="#6B3A2E"/>
  <rect y="560" width="800" height="14" fill="#8A4E3C"/>
  <ellipse cx="400" cy="600" rx="270" ry="40" fill="#000" opacity=".25" filter="url(#b10)"/>
  <ellipse cx="400" cy="585" rx="250" ry="34" fill="#F6EFE6"/><ellipse cx="400" cy="578" rx="236" ry="28" fill="#fff"/>
  <path d="M190 420h420v150q-210 30-420 0z" fill="#F7B6C4"/>

  <path d="M250 300h300v124H250z" fill="#F28FA8"/>

  <ellipse cx="400" cy="300" rx="150" ry="16" fill="#FFF7EE"/>
  ${Array.from({ length: 40 }, () => `<rect x="${200 + rnd() * 400}" y="${440 + rnd() * 110}" width="10" height="3.5" rx="1.7" fill="${["#FFD166", "#6C8EF2", "#7ED7C1", "#fff"][Math.floor(rnd() * 4)]}" transform="rotate(${rnd() * 180} 400 500)" opacity=".9"/>`).join("")}
  ${[310, 360, 410, 460].map((x, i) => `
    <rect x="${x - 7}" y="${190 + (i % 2) * 14}" width="14" height="${112 - (i % 2) * 14}" rx="3" fill="${["#6C8EF2", "#FFD166", "#7ED7C1", "#FF9EB5"][i]}"/>
    <path d="M${x - 7} ${210 + (i % 2) * 14}l14-8M${x - 7} ${236 + (i % 2) * 14}l14-8M${x - 7} ${262 + (i % 2) * 14}l14-8" stroke="#fff" stroke-width="4" opacity=".7"/>
    <circle cx="${x}" cy="${170 + (i % 2) * 14}" r="40" fill="#FFC970" opacity=".35" filter="url(#b24)"/>
    <path d="M${x} ${148 + (i % 2) * 14}c10 14 10 26 0 32-10-6-10-18 0-32z" fill="#FFB547"/>
    <path d="M${x} ${160 + (i % 2) * 14}c5 8 5 14 0 18-5-4-5-10 0-18z" fill="#FFF3C4"/>`).join("")}
  <g transform="translate(500 228) rotate(8)"><rect x="-4" y="0" width="5" height="80" fill="#C9A24A"/><text x="0" y="-6" font-family="Fraunces" font-weight="800" font-size="74" fill="#E5C26B" text-anchor="middle" stroke="#9C7A2C" stroke-width="2">30</text></g>
`);

/* 2. Karaoke night */
seed(11);
scene("karaoke", `

  <rect width="800" height="800" fill="url(#kk)"/>
  ${[[-80, "#FF4FA3"], [180, "#6A5CFF"], [460, "#2FD3C4"]].map(([x, c]) => `<polygon points="${x + 120},0 ${x + 200},0 ${x + 360},800 ${x - 40},800" fill="${c}" opacity=".16" filter="url(#b10)"/>`).join("")}

  <g transform="translate(640 120)">

    <circle r="62" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/>
  </g>
  ${Array.from({ length: 30 }, () => `<path d="M${rnd() * 800} ${300 + rnd() * 480}l3 -9 3 9 9 3 -9 3 -3 9 -3 -9 -9 -3z" fill="#fff" opacity="${0.3 + rnd() * 0.6}"/>`).join("")}
  <g transform="translate(400 470)">
    <rect x="-6" y="40" width="12" height="300" fill="#2A2233"/>
    <rect x="-70" y="330" width="140" height="14" rx="7" fill="#2A2233"/>
    <path d="M-26 40h52l-8 70h-36z" fill="#3D3446"/>
    <ellipse cx="0" cy="0" rx="46" ry="58" fill="#4B4256"/>
    ${Array.from({ length: 6 }, (_, i) => `<path d="M-44 ${-30 + i * 12}h88" stroke="#6E6480" stroke-width="3"/>`).join("")}
    <ellipse cx="-16" cy="-24" rx="10" ry="20" fill="#fff" opacity=".25"/>
  </g>
  <ellipse cx="400" cy="820" rx="300" ry="60" fill="#FF4FA3" opacity=".3" filter="url(#b24)"/>
`);

/* 3. Sunrise hike */
seed(5);
scene("hike", `
  <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6C7BC9"/><stop offset=".45" stop-color="#F3A6A0"/><stop offset=".7" stop-color="#FFD39A"/></linearGradient>
  <rect width="800" height="800" fill="url(#sk)"/>
  <circle cx="520" cy="430" r="160" fill="#FFF1C9" opacity=".6" filter="url(#b50)"/>
  <circle cx="520" cy="440" r="64" fill="#FFF6DD"/>
  ${Array.from({ length: 5 }, () => `<ellipse cx="${rnd() * 800}" cy="${120 + rnd() * 200}" rx="${80 + rnd() * 90}" ry="${10 + rnd() * 10}" fill="#fff" opacity=".35" filter="url(#b4)"/>`).join("")}
  <path d="M0 520L120 400l90 70 120-150 140 160 110-110 220 160V800H0z" fill="#B48AA8"/>
  <path d="M0 600L160 470l110 80 150-140 120 120 100-70 160 120V800H0z" fill="#8C6A93"/>
  <path d="M0 680l200-120 140 70 160-110 140 100 160-60V800H0z" fill="#5C4A73"/>
  <path d="M0 740l260-90 180 50 360-80V800H0z" fill="#3C3157"/>
  <g transform="translate(470 520)" fill="#2A2240">
    <circle cx="0" cy="-34" r="6"/><path d="M-5-28h10l3 22-4 18h-4l-1-14-2 14h-4l1-18z"/><rect x="5" y="-26" width="9" height="16" rx="3"/>
    <circle cx="28" cy="-30" r="5.5"/><path d="M23-25h10l2 20-3 17h-4l-1-13-2 13h-4l1-17z"/>
  </g>
  ${[[180, 230], [210, 210], [240, 238]].map(([x, y]) => `<path d="M${x} ${y}q8-8 16 0q8-8 16 0" stroke="#3C3157" stroke-width="3" fill="none" stroke-linecap="round"/>`).join("")}
`);

/* 4. Rainy tram street */
seed(9);
scene("tram", `
  <linearGradient id="dk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4A6B"/><stop offset="1" stop-color="#C98F7B"/></linearGradient>
  <rect width="800" height="800" fill="url(#dk)"/>
  ${[0, 1, 2, 3, 4, 5].map((i) => { const x = i * 140 - 20, h = 330 + (i % 3) * 60, c = ["#E8D3B5", "#C9DCE4", "#F0C6B2", "#E3E0C9", "#BFD1C5", "#EBCFA8"][i]; return `<rect x="${x}" y="${600 - h}" width="140" height="${h}" fill="${c}"/>${Array.from({ length: 8 }, (_, k) => `<rect x="${x + 20 + (k % 3) * 38}" y="${600 - h + 30 + Math.floor(k / 3) * 70}" width="24" height="40" rx="12" fill="${rnd() > .4 ? "#FFD98A" : "#4A5470"}" opacity=".9"/>`).join("")}<rect x="${x}" y="${600 - h}" width="140" height="10" fill="#000" opacity=".12"/>`; }).join("")}
  <rect y="600" width="800" height="200" fill="#5B5A6E"/>
  ${Array.from({ length: 12 }, () => `<rect x="${rnd() * 800}" y="${620 + rnd() * 160}" width="${30 + rnd() * 60}" height="3" fill="#FFD98A" opacity=".35"/>`).join("")}
  <path d="M0 640h800M0 700h800" stroke="#8C8AA0" stroke-width="5"/>
  <g transform="translate(150 380)">
    <line x1="210" y1="-200" x2="250" y2="0" stroke="#2C2C3A" stroke-width="3"/>
    <rect x="0" y="0" width="460" height="230" rx="34" fill="#F5C33B"/>
    <rect x="0" y="150" width="460" height="80" rx="10" fill="#F2F0EA"/>
    ${[0, 1, 2, 3, 4].map((k) => `<rect x="${30 + k * 84}" y="34" width="66" height="90" rx="10" fill="#2E3A55"/><rect x="${36 + k * 84}" y="40" width="20" height="78" rx="8" fill="#fff" opacity=".18"/>`).join("")}
    <circle cx="90" cy="236" r="22" fill="#2C2C3A"/><circle cx="370" cy="236" r="22" fill="#2C2C3A"/>
    <circle cx="440" cy="170" r="10" fill="#FFF3C4"/><circle cx="440" cy="170" r="40" fill="#FFF3C4" opacity=".4" filter="url(#b24)"/>
    <text x="230" y="-14" text-anchor="middle" font-family="Space Mono" font-size="22" font-weight="700" fill="#2C2C3A">28</text>
  </g>
  ${Array.from({ length: 160 }, () => { const x = rnd() * 820, y = rnd() * 800; return `<line x1="${x}" y1="${y}" x2="${x - 6}" y2="${y + 26}" stroke="#E6EEF7" stroke-width="1.6" opacity="${0.25 + rnd() * 0.35}"/>`; }).join("")}
`);

/* 5. Beach day */
seed(2);
scene("beach", `
  <linearGradient id="bs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD3F2"/><stop offset="1" stop-color="#E9F7FC"/></linearGradient>

  <path d="M0 500q200-30 400 0t400 0V800H0z" fill="#FFFFFF" opacity=".75"/>

  ${Array.from({ length: 80 }, () => `<circle cx="${rnd() * 800}" cy="${540 + rnd() * 260}" r="${1 + rnd() * 2}" fill="#D9BC8A"/>`).join("")}
  <g transform="translate(250 330)">

    <path d="M-200 60Q-130-40 -66 0zM66 0Q130-40 200 60z" fill="#FFF3E2"/>

`);

/* 6. Picnic */
seed(4);
scene("picnic", `
  <linearGradient id="ps" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDE8F6"/><stop offset=".5" stop-color="#E7F3D8"/></linearGradient>

  ${Array.from({ length: 120 }, () => { const x = rnd() * 800, y = 410 + rnd() * 390; return `<path d="M${x} ${y}l3-10 3 10" stroke="#7AB35F" stroke-width="2" fill="none"/>`; }).join("")}
  <g transform="translate(400 600) skewX(-14) scale(1 .55)">
    <rect x="-280" y="-280" width="560" height="560" fill="#F7F1E6"/>
    ${Array.from({ length: 7 }, (_, i) => `<rect x="${-280 + i * 80}" y="-280" width="40" height="560" fill="#E8577E" opacity=".55"/><rect x="-280" y="${-280 + i * 80}" width="560" height="40" fill="#E8577E" opacity=".55"/>`).join("")}
  </g>
  <g transform="translate(300 520)">
    <path d="M-70 0h140l-16 90h-108z" fill="#C9935C"/><path d="M-70 0h140" stroke="#9C6B3C" stroke-width="10"/>
    ${[0, 1, 2, 3].map((k) => `<path d="M-60 ${20 + k * 18}h120" stroke="#9C6B3C" stroke-width="3" opacity=".6"/>`).join("")}
    <path d="M-50 0q50-80 100 0" stroke="#9C6B3C" stroke-width="8" fill="none"/>
    <circle cx="-30" cy="-6" r="16" fill="#E8463A"/><circle cx="0" cy="-10" r="14" fill="#F2B233"/>

  <g transform="translate(610 600)"><circle r="44" fill="#FFF7EE"/><circle r="36" fill="#F5C6A0"/>${Array.from({ length: 8 }, (_, k) => `<path d="M0 0L${Math.cos(k * .785) * 36} ${Math.sin(k * .785) * 36}" stroke="#FFF7EE" stroke-width="3"/>`).join("")}</g>
`);

/* 7. Sam's desk */
seed(6);
scene("desk", `
  <rect width="800" height="800" fill="#EFE6D8"/>
  <rect x="80" y="70" width="640" height="420" rx="10" fill="#BFE0F2"/>
